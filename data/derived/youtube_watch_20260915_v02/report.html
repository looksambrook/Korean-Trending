<script>
const data=JSON.parse(document.getElementById('payload').textContent), byId=new Map(data.observations.map(r=>[r.observation_id,r]));
const $=id=>document.getElementById(id);let mode='candidates';
const node=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const title=r=>r.context?.title||r.text?.split('\n')[0]||r.video_id;
const channel=r=>r.context?.channel_label||r.channel_id||'채널 미상';
const ids=c=>c.evidence_observation_ids.map(x=>byId.get(x)).filter(Boolean);
for(const [label,value,note] of [['관측 영상',data.observations.length,'제목·설명'],['채널',new Set(data.observations.map(r=>r.channel_id)).size,'편의 표본'],['반복 표현 후보',data.candidates.length,'자동 추출 · 미확정'],['공개 피드 요청',data.manifest.counts.requests,'유료 API·모델 호출 없음']]){let n=node('div',undefined,'stat');n.append(node('small',label),node('strong',String(value)),node('small',note));$('stats').append(n)}
$('scope').textContent='관측 시각: '+data.summary.cutoff+' · '+data.summary.method+' · 실제 수집 원문을 보존했습니다. 원본 영상·음성·댓글은 수집하지 않았습니다. 전체 관측 문서 탭에는 후보에서 빠진 문서도 표시합니다.';
for(const [id,name] of new Map(data.observations.map(r=>[r.channel_id,channel(r)]))){let o=node('option',name);o.value=id;$('channel').append(o)}
function evidence(r){let e=node('div',undefined,'evidence'),a=node('a',title(r));a.href='https://www.youtube.com/watch?v='+encodeURIComponent(r.video_id);a.target='_blank';a.rel='noopener noreferrer';e.append(a,node('div',channel(r)+' · 게시 '+r.posted_at,'count'));let d=node('details');d.append(node('summary','원문·설명·관측 시각 보기'));d.append(node('pre',r.text),node('div','수집 '+r.collected_at+' / 이용 가능 '+r.available_at,'count'));e.append(d);return e}
function select(item){$('detail').replaceChildren();$('detail').className='';if(mode==='candidates'){let rows=ids(item);$('detailTitle').textContent=item.representative_phrase;$('detail').append(node('p','자동 후보입니다. 같은 채널의 재활용, 프로그램명, 광고 문구일 수 있습니다. 독립 사용이나 의미를 확정한 결과는 아닙니다.','muted'));$('detail').append(node('div',(item.surface_forms||[]).join(' · '),'tag'));for(let r of rows)$('detail').append(evidence(r))}else{$('detailTitle').textContent=title(item);$('detail').append(evidence(item))}}
function render(){const q=$('query').value.toLocaleLowerCase(),cid=$('channel').value;let rows=(mode==='candidates'?data.candidates:data.observations).filter(r=>{const evidenceRows=mode==='candidates'?ids(r):[r];return (!cid||evidenceRows.some(e=>e.channel_id===cid))&&(!q||((mode==='candidates'?r.representative_phrase+' '+r.surface_forms.join(' '):r.text)+' '+evidenceRows.map(e=>channel(e)+' '+title(e)).join(' ')).toLocaleLowerCase().includes(q))});$('list').replaceChildren();$('listTitle').textContent=(mode==='candidates'?'관측된 반복 표현':'전체 관측 문서')+' · '+rows.length;for(let r of rows){let c=node('button',undefined,'card');c.style.textAlign='left';c.append(node('h3',mode==='candidates'?r.representative_phrase:title(r)));if(mode==='candidates'){let es=ids(r);c.append(node('div','영상 '+new Set(es.map(e=>e.video_id)).size+' · 채널 '+new Set(es.map(e=>e.channel_id)).size+' · 자동 후보','count'))}else c.append(node('div',channel(r)+' · '+r.posted_at.slice(0,10),'count'));c.onclick=()=>select(r);$('list').append(c)}if(!rows.length)$('list').append(node('div','조건에 맞는 관측 자료가 없습니다.','empty'))}
$('query').oninput=render;$('channel').onchange=render;for(const [id,value] of [['candidateTab','candidates'],['allTab','all']])$(id).onclick=()=>{mode=value;$('candidateTab').className=mode==='candidates'?'active':'';$('allTab').className=mode==='all'?'active':'';render()};
$('limits').append(node('p','게시일 범위는 채널마다 다릅니다. 현재 받은 피드로 과거의 발견 가능성이나 플랫폼 전체 유행을 복원할 수 없습니다.'));for(let r of data.manifest.requests)$('limits').append(node('div',r.channel_id+' · '+r.status+' · 영상 '+(r.observations||0)));$('limits').append(node('p','탐지 제외 '+data.summary.excluded_observations+'건 · 안내문 등 억제 '+data.suppressed.length+'개 기록. 원본 삭제 없이 별도 기록합니다.'));let ds=node('details');ds.append(node('summary','제외·억제 사유 보기'),node('pre',JSON.stringify({exclusions:data.exclusions,suppressed:data.suppressed},null,2)));$('limits').append(ds);
$('footer').textContent='수집 실행 '+data.manifest.run_id+' / 후보 추출 '+data.summary.run_id+' / 보고서 '+data.report_run_id+' · 통제된 모델 이해 실험 및 사람 정답 평가는 아직 수행하지 않았습니다.';render();
